<!DOCTYPE html>
<html>
<head>
    <title>Glass Login</title>
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: rgba(0, 0, 0, 0.5) no-repeat center center/cover;
        }

        .login-box{
            width:350px;
            padding:40px;
            border-radius:15px;

            /* Glass effect */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border:1px solid rgba(255,255,255,0.3);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);

            text-align:center;
            color:white;
        }

        .login-box h2{
            margin-bottom:25px;
            letter-spacing:2px;
        }

        .login-box input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            outline:none;
            border-radius:25px;
            background: rgba(255,255,255,0.2);
            color:white;
            font-size:14px;
        }

        .login-box input::placeholder{
            color:#eee;
        }

        .login-box button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:25px;
            background:white;
            color:black;
            font-weight:bold;
            cursor:pointer;
        }

        .login-box button:hover{
            background:#ddd;
        }

        .login-box p{
            margin-top:15px;
            font-size:14px;
        }

        .login-box a{
            color:#fff;
            text-decoration:underline;
        }

    </style>
</head>
<body>

    <div class="login-box">
        <h2>LOGIN</h2>
        <form>
            <input type="email" placeholder="Enter your email" required>
            <input type="password" placeholder="Enter your password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="#">Register</a></p>
    </div>

</body>
</html>
